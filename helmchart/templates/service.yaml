apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-serevox-app
  labels:
    app: serevox-app
spec:
  selector:
    app: serevox-app
  ports:
    - name: http
      port: {{ .Values.services.serevox-app.port }}
      targetPort: {{ .Values.services.serevox-app.port }}
  type: ClusterIP
